<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Planner — TomS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:13px}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:196px;background:#1a1f36;display:flex;flex-direction:column;flex-shrink:0;transition:width .22s;overflow:hidden}
.sidebar.col{width:48px}
.sb-brand{padding:13px 12px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px;min-height:54px;position:relative}
.sb-logo{width:30px;height:30px;border-radius:7px;background:#e63946;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-tog{position:absolute;right:-10px;top:16px;width:20px;height:20px;background:#1a1f36;border:1px solid rgba(255,255,255,.2);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:10px;z-index:20}
.sb-sec{padding:7px 7px 2px}
.sb-lbl{font-size:9px;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.06em;padding:4px 5px 3px;white-space:nowrap;overflow:hidden}
.ni{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;color:rgba(255,255,255,.62);font-size:12px;transition:all .14s;white-space:nowrap;overflow:hidden}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.act{background:#e63946;color:#fff;font-weight:600}
.ni .ic{font-size:14px;flex-shrink:0;width:17px;text-align:center}
.sidebar.col .ni span,.sidebar.col .sb-lbl,.sidebar.col .sb-bt{display:none}
.sb-foot{margin-top:auto;padding:9px 7px;border-top:1px solid rgba(255,255,255,.08)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0}
.tb-title{font-size:14px;font-weight:700;color:#1a1f36}
.tb-sub{font-size:10px;color:#9ca3af;margin-top:1px}
.tb-r{display:flex;align-items:center;gap:7px}
.content{flex:1;overflow-y:auto;padding:14px 18px;background:#f0f2f5}

/* SYNC BAR */
.sbar{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:6px;font-size:10px;border:1px solid}
.sbar.ok{background:#f0fdf4;border-color:#a7f3d0;color:#065f46}
.sbar.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.sbar.load{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.sd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sd.g{background:#10b981}.sd.r{background:#ef4444}.sd.b{background:#3b82f6;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* BUTTON */
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .14s;white-space:nowrap}
.btn-r{background:#e63946;color:#fff}.btn-r:hover{background:#c0303b}
.btn-g{background:#10b981;color:#fff}.btn-g:hover{background:#059669}
.btn-b{background:#3b82f6;color:#fff}.btn-b:hover{background:#2563eb}
.btn-o{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-o:hover{background:#f9fafb}
.btn-gh{background:transparent;color:#6b7280;border:none;padding:3px 7px;font-size:12px}.btn-gh:hover{background:#f3f4f6;color:#374151}
.btn-xs{padding:3px 8px;font-size:10px}
.btn-ic{width:26px;height:26px;padding:0;justify-content:center;border-radius:5px}

/* KPI BANNER */
.kban{display:flex;background:#1a1f36;border-radius:9px;overflow:hidden;margin-bottom:14px}
.kban-hd{background:#111827;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:95px}
.kban-ico{font-size:20px;margin-bottom:3px}
.kban-lbl{font-size:9px;font-weight:700;color:#fff;text-align:center;line-height:1.3}
.kitems{display:flex;flex:1;flex-wrap:wrap}
.kitem{flex:1;min-width:90px;padding:10px 12px;border-right:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px}
.kitem:last-child{border-right:none}
.kico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.kr{background:rgba(230,57,70,.2);color:#ef4444}
.kg{background:rgba(16,185,129,.2);color:#10b981}
.ka{background:rgba(245,158,11,.2);color:#f59e0b}
.kb{background:rgba(59,130,246,.2);color:#3b82f6}
.kp{background:rgba(139,92,246,.2);color:#8b5cf6}
.kgr{background:rgba(156,163,175,.2);color:#9ca3af}
.knum{font-size:16px;font-weight:800;color:#fff;line-height:1}
.klbl{font-size:9px;color:rgba(255,255,255,.45);margin-top:2px}

/* CARD */
.card{background:#fff;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:14px;overflow:hidden}
.chd{padding:10px 14px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px}
.chd-dk{background:#1a1f36;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px}
.ctitle{font-size:12px;font-weight:700;color:#1a1f36}
.ctitle-w{font-size:12px;font-weight:700;color:#fff}
.csub{font-size:10px;color:#9ca3af}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;color:#6b7280;text-transform:uppercase;padding:7px 11px;border-bottom:1px solid #e5e7eb;background:#f9fafb;text-align:left;white-space:nowrap}
.tbl td{padding:8px 11px;border-bottom:1px solid #f3f4f6;vertical-align:middle;color:#374151}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafafa}
.tbl-dk th{background:#1a1f36;color:rgba(255,255,255,.65);border-bottom:none}
.tbl-dk th:first-child{border-radius:0}
.tbl td.sep-row{background:#f9fafb;border-top:1px solid #e5e7eb;padding:5px 11px}
.sep-lbl{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
.tbl td input,.tbl td select{width:100%;padding:4px 7px;border:1px solid #e5e7eb;border-radius:5px;font-size:11px;font-family:inherit;color:#1a1f36;background:#fff;transition:border .14s}
.tbl td input:focus,.tbl td select:focus{outline:none;border-color:#e63946}
.tbl td input[type=number]{text-align:right}

/* RACE CARDS GRID */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:11px;margin-bottom:14px}
.rcard{background:#fff;border-radius:8px;border:1px solid #e5e7eb;padding:11px 13px;border-top:3px solid;cursor:pointer;transition:box-shadow .14s}
.rcard:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.rc-name{font-size:11px;font-weight:700;color:#1a1f36;line-height:1.3;margin-bottom:3px}
.rc-date{font-size:10px;color:#9ca3af;margin-bottom:5px}
.rc-val{font-size:15px;font-weight:800;color:#1a1f36;line-height:1;margin-bottom:3px}
.rc-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}
.pbar{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:4px}
.pfill{height:100%;border-radius:3px}
.pfg{background:#10b981}.pfa{background:#f59e0b}.pfr{background:#ef4444}.pfb{background:#3b82f6}.pfgr{background:#d1d5db}

/* PILL / TAG */
.pill{display:inline-flex;align-items:center;font-size:9px;font-weight:600;padding:2px 7px;border-radius:10px}
.pg{background:#d1fae5;color:#065f46}.pa{background:#fef3c7;color:#92400e}.pr{background:#fee2e2;color:#991b1b}.pb{background:#dbeafe;color:#1e40af}.pgr{background:#f3f4f6;color:#6b7280}
.tag{display:inline-flex;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em}
.t-entry{background:#fee2e2;color:#991b1b}.t-flight{background:#dbeafe;color:#1e40af}.t-hotel{background:#ede9fe;color:#5b21b6}
.t-food{background:#d1fae5;color:#065f46}.t-expo{background:#f3f4f6;color:#6b7280}.t-gear{background:#fef3c7;color:#92400e}
.t-apparel{background:#f0fdf4;color:#166534}.t-nutri{background:#ecfdf5;color:#065f46}.t-coach{background:#fce7f3;color:#9d174d}
.t-travel{background:#e0f2fe;color:#075985}.t-ins{background:#faf5ff;color:#6b21a8}.t-misc{background:#f3f4f6;color:#6b7280}

/* RACE TABS */
.rtabs{display:flex;border-bottom:2px solid #e5e7eb;overflow-x:auto;background:#fff}
.rtab{padding:8px 13px;font-size:11px;font-weight:600;color:#9ca3af;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .13s;display:flex;align-items:center;gap:5px}
.rtab:hover{color:#374151}
.rtab.act{color:#e63946;border-bottom-color:#e63946}
.rtab .cnt{font-size:9px;background:#f3f4f6;color:#6b7280;padding:1px 5px;border-radius:8px}
.rtab.act .cnt{background:#fee2e2;color:#991b1b}

/* GANTT */
.gantt-wrap{overflow-x:auto}
.gantt-tbl{border-collapse:collapse;table-layout:fixed}
.gantt-tbl th{padding:7px 4px;font-size:9px;font-weight:700;text-align:center;white-space:nowrap;border-right:1px solid rgba(255,255,255,.1)}
.gantt-tbl th.info{text-align:left;padding:7px 11px}
.gantt-tbl td{border-right:1px solid #f0f0f0;padding:0;height:38px;position:relative}
.gantt-tbl td.info{padding:8px 11px;border-right:1px solid #e5e7eb}
.gantt-bar{position:absolute;top:9px;height:20px;border-radius:5px;left:5%;width:90%;display:flex;align-items:center;justify-content:center}
.gantt-bar span{font-size:8px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.gantt-cur{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#f59e0b;opacity:.5}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.44);z-index:200;display:none;align-items:center;justify-content:center}
.mo.open{display:flex}
.modal{background:#fff;border-radius:9px;width:540px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.mhd{padding:13px 17px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mtitle{font-size:13px;font-weight:700;color:#1a1f36}
.mclose{width:24px;height:24px;border-radius:50%;border:none;background:#f3f4f6;cursor:pointer;font-size:13px;color:#6b7280;display:flex;align-items:center;justify-content:center}
.mbody{padding:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrp{display:flex;flex-direction:column;gap:3px}
.fgrp.full{grid-column:1/-1}
.lbl{font-size:10px;font-weight:600;color:#374151}.req{color:#e63946;margin-left:1px}
.fi{width:100%;padding:6px 9px;border:1px solid #d1d5db;border-radius:5px;font-size:12px;color:#1a1f36;background:#fff;font-family:inherit;transition:border .14s}
.fi:focus{outline:none;border-color:#e63946;box-shadow:0 0 0 2px rgba(230,57,70,.08)}
.hint{font-size:9px;color:#9ca3af;margin-top:1px}
.facts{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;padding-top:11px;border-top:1px solid #f3f4f6}

/* 2-col layout */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* NOTIF */
.notif{position:fixed;top:14px;right:18px;background:#1a1f36;color:#fff;padding:9px 15px;border-radius:7px;font-size:11px;font-weight:600;z-index:300;display:none;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.notif.show{display:flex}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar" id="SB">
  <div class="sb-brand">
    <div class="sb-logo">🏃</div>
    <div class="sb-bt" style="overflow:hidden">
      <div style="font-size:12px;font-weight:700;color:#fff;white-space:nowrap">Race Planner</div>
      <div style="font-size:9px;color:rgba(255,255,255,.45);white-space:nowrap">TomS · 2026–2027</div>
    </div>
    <div class="sb-tog" onclick="toggleSB()" id="sbTog">‹</div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">Dashboard</div>
    <div class="ni" id="n-overview" onclick="go('overview')"><span class="ic">📊</span><span>Overview</span></div>
    <div class="ni" id="n-training" onclick="go('training')"><span class="ic">📅</span><span>Training Plan</span></div>
    <div class="ni" id="n-races" onclick="go('races')"><span class="ic">🏆</span><span>Race Calendar</span></div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">การเงิน</div>
    <div class="ni act" id="n-finance" onclick="go('finance')"><span class="ic">💰</span><span>ค่าใช้จ่าย</span></div>
    <div class="ni" id="n-gear" onclick="go('gear')"><span class="ic">👟</span><span>อุปกรณ์</span></div>
    <div class="ni" id="n-travel" onclick="go('travel')"><span class="ic">✈️</span><span>ค่าเดินทาง</span></div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">สถิติ</div>
    <div class="ni" id="n-performance" onclick="go('performance')"><span class="ic">📈</span><span>Performance</span></div>
    <div class="ni" id="n-log" onclick="go('log')"><span class="ic">📋</span><span>Training Log</span></div>
  </div>
  <div class="sb-foot">
    <div style="display:flex;align-items:center;gap:8px;padding:5px 7px">
      <div style="width:28px;height:28px;border-radius:50%;background:#e63946;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">TS</div>
      <div class="sb-bt"><div style="font-size:11px;font-weight:600;color:#fff">TomS</div><div style="font-size:9px;color:rgba(255,255,255,.4)">Endurance Athlete</div></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="tb-title" id="TB_TITLE">💰 ค่าใช้จ่าย</div>
      <div class="tb-sub">Race Planner · TomS · 2026–2027</div>
    </div>
    <div class="tb-r">
      <div class="sbar load" id="SBAR"><div class="sd b" id="SD"></div><span id="SMSG">กำลังเชื่อมต่อ...</span></div>
      <button class="btn btn-o btn-xs" onclick="syncNow()">☁️ Sync</button>
      <button class="btn btn-b btn-xs" onclick="pushAll()">📤 บันทึก→Sheets</button>
      <button class="btn btn-xs" style="background:#6b7280;color:#fff" onclick="resetAndRepush()" title="ล้าง localStorage แล้ว push ข้อมูล default ใหม่">🔄 Reset DB</button>
      <button class="btn btn-r btn-xs" id="BTN_ADD" onclick="topAdd()">+ เพิ่ม</button>
    </div>
  </div>
  <div class="content" id="CONTENT"></div>
</div>
</div>

<!-- EXPENSE MODAL -->
<div class="mo" id="MO_EXP">
  <div class="modal">
    <div class="mhd"><div class="mtitle" id="MO_EXP_TITLE">💰 เพิ่มค่าใช้จ่าย</div><button class="mclose" onclick="closeMo('EXP')">✕</button></div>
    <div class="mbody">
      <div class="fgrid">
        <div class="fgrp full"><label class="lbl">Race<span class="req">*</span></label><select class="fi" id="E_RACE"></select></div>
        <div class="fgrp full"><label class="lbl">รายการ<span class="req">*</span></label><input class="fi" id="E_NAME" placeholder="เช่น ตั๋วเครื่องบิน BKK-NRT..." /></div>
        <div class="fgrp"><label class="lbl">หมวด<span class="req">*</span></label>
          <select class="fi" id="E_CAT">
            <option value="ค่าสมัคร">ค่าสมัคร (Race Entry)</option>
            <option value="ตั๋วเครื่องบิน">ตั๋วเครื่องบิน</option>
            <option value="โรงแรม">โรงแรม / ที่พัก</option>
            <option value="ค่าอาหาร">ค่าอาหาร</option>
            <option value="Expo">Expo / ของที่ระลึก</option>
            <option value="อุปกรณ์">อุปกรณ์ (Gear)</option>
            <option value="เสื้อผ้า">เสื้อผ้า (Apparel)</option>
            <option value="Nutrition">Nutrition / Gel</option>
            <option value="Coaching">Coaching / Training</option>
            <option value="ค่าเดินทาง">ค่าเดินทาง</option>
            <option value="ประกัน">ประกันการเดินทาง</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
        <div class="fgrp"><label class="lbl">สถานะ</label>
          <select class="fi" id="E_STATUS">
            <option value="วางแผน">📋 วางแผน</option>
            <option value="จ่ายแล้ว">✅ จ่ายแล้ว</option>
            <option value="รอยืนยัน">⏳ รอยืนยัน</option>
          </select>
        </div>
        <div class="fgrp"><label class="lbl">จำนวน (฿)<span class="req">*</span></label><input class="fi" id="E_AMT" type="number" step="1" placeholder="0" /></div>
        <div class="fgrp"><label class="lbl">วันที่จ่าย</label><input class="fi" id="E_DATE" type="date" /></div>
        <div class="fgrp"><label class="lbl">สกุลเงินต้นทาง</label><select class="fi" id="E_CUR"><option value="THB">THB</option><option value="JPY">JPY</option><option value="USD">USD</option></select></div>
        <div class="fgrp"><label class="lbl">จำนวนสกุลต้นทาง</label><input class="fi" id="E_ORIG" type="number" placeholder="เช่น 15000 JPY" /></div>
        <div class="fgrp"><label class="lbl">ช่องทางชำระ</label><select class="fi" id="E_MTH"><option>บัตรเครดิต</option><option>โอนธนาคาร</option><option>เงินสด</option><option>PromptPay</option></select></div>
        <div class="fgrp full"><label class="lbl">หมายเหตุ</label><input class="fi" id="E_NOTE" placeholder="รายละเอียด..." /></div>
      </div>
      <div class="facts">
        <button class="btn btn-o" onclick="closeMo('EXP')">ยกเลิก</button>
        <button class="btn btn-r" onclick="saveExp()">💾 บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- RACE MODAL -->
<div class="mo" id="MO_RACE">
  <div class="modal">
    <div class="mhd"><div class="mtitle" id="MO_RACE_TITLE">🏆 เพิ่ม Race</div><button class="mclose" onclick="closeMo('RACE')">✕</button></div>
    <div class="mbody">
      <div class="fgrid">
        <div class="fgrp full"><label class="lbl">ชื่อ Race<span class="req">*</span></label><input class="fi" id="R_NAME" placeholder="เช่น Bangkok Marathon 2027" /></div>
        <div class="fgrp"><label class="lbl">ประเภท<span class="req">*</span></label>
          <select class="fi" id="R_TYPE">
            <option>Marathon</option><option>Half Marathon</option><option>10K Run</option>
            <option>Hyrox</option><option>Triathlon</option><option>Trail Run</option><option>อื่นๆ</option>
          </select>
        </div>
        <div class="fgrp"><label class="lbl">วันที่แข่ง</label><input class="fi" id="R_DATE" type="date" /></div>
        <div class="fgrp"><label class="lbl">สถานที่</label><input class="fi" id="R_LOC" placeholder="Bangkok, TH" /></div>
        <div class="fgrp"><label class="lbl">Budget (฿)</label><input class="fi" id="R_BUD" type="number" placeholder="0" /></div>
        <div class="fgrp"><label class="lbl">เป้าหมาย Finish Time</label><input class="fi" id="R_TARGET" placeholder="3:45:00" /></div>
      </div>
      <div class="facts">
        <button class="btn btn-o" onclick="closeMo('RACE')">ยกเลิก</button>
        <button class="btn btn-r" onclick="saveRace()">💾 บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- TRAINING MODAL -->
<div class="mo" id="MO_TR">
  <div class="modal">
    <div class="mhd"><div class="mtitle" id="MO_TR_TITLE">📅 บันทึกการซ้อม</div><button class="mclose" onclick="closeMo('TR')">✕</button></div>
    <div class="mbody">
      <div class="fgrid">

function nextExpId(){

}

// ── JSONP (works from file://) ──
function fetchGET(url){
  return new Promise(function(resolve,reject){
    var cb='_cb'+Date.now();
    var tag=document.createElement('script');
    var t=setTimeout(function(){ cleanup(); reject(new Error('Timeout')); },15000);
    function cleanup(){ delete window[cb]; if(tag.parentNode)tag.parentNode.removeChild(tag); clearTimeout(t); }
    window[cb]=function(d){ cleanup(); resolve(d); };
    tag.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
    tag.onerror=function(){ cleanup(); reject(new Error('Network error')); };
    document.head.appendChild(tag);
  });

// gsPost: fetch POST (localhost) or JSONP GET (file://)
async function gsPost(payload){
  try{
    var res = await fetch(GS, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(payload),
      redirect: 'follow'
    });
    var txt = await res.text();
    return JSON.parse(txt);
  } catch(fetchErr) {
    console.log('fetch blocked (file://), using JSONP:', fetchErr.message);
    return await gsJsonpWrite(payload);
  }
}

// gsJsonpWrite: used as fallback from gsPost catch
// Since JSONP script tags can't follow Apps Script redirect,
// we keep this as a no-op and rely on fetch only
function gsJsonpOne(payload){
  // JSONP blocked by Apps Script redirect — not usable
  return Promise.resolve({status:'error', msg:'JSONP not supported by Apps Script redirect'});
}

async function gsJsonpWrite(payload){
  // Direct JSONP blocked — try fetch without CORS mode
  try {
    var res = await fetch(GS, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(payload),
      redirect: 'follow'
    });
    return JSON.parse(await res.text());
  } catch(e) {
    console.warn('gsJsonpWrite fetch failed:', e.message);
    return {status:'error', msg:e.message};
  }
}

async function upsertRow(sheet, row){
  var payload = {action:'upsert', sheet:sheet, row:row};
  try {
    var d = await gsPost(payload);
    if(d.status==='ok'){
      setSbar('ok','✅ Saved ['+d.action+'] '+row.id+' → '+sheet+' · '+new Date().toLocaleTimeString('th-TH'));
    } else {
      setSbar('err','Save error '+row.id+': '+(d.msg||''));
      notify('❌ บันทึกไม่ได้: '+(d.msg||row.id),'❌');
    }
    return d;
  } catch(e) {
    setSbar('err','Network error — เปิดผ่าน start_server.bat แทน');
    notify('❌ ต้องเปิดผ่าน localhost:8080 — ดูคำแนะนำ','❌');
    showCorsHelp();
    return {status:'error', msg:e.message};
  }
}

async function deleteRow(sheet, id){
  // ใช้ JSONP GET โดยตรง — ทำงานได้จาก file:// เสมอ
  var payload = {action:'delete', sheet:sheet, id:String(id)};
  setSbar('load','Deleting '+id+'...');
  var d = await gsJsonpOne(payload);
  if(d.status==='ok')
    setSbar('ok','✅ Deleted '+id+' · '+new Date().toLocaleTimeString('th-TH'));
  else
    setSbar('err','Delete error: '+(d.msg||JSON.stringify(d)));
  return d;
}

async function pushAll(){
  setSbar('load','กำลังบันทึก... ('+EXPENSES.length+' exp + '+TRAINING.length+' tr sessions)');
  var btn=document.querySelector('[onclick="pushAll()"]');
  if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
  var payload={action:'saveAll',
    races:RACES.map(function(r){ return Object.assign({},r,{budget:BUDGETS[r.id]||0}); }),
    expenses:EXPENSES,
    training:TRAINING};
  // ใช้ JSONP write (chunk) เสมอ — ไม่ต้อง fallback
  var d = await gsJsonpWrite(payload);
  if(d.status==='ok'||d.status==='partial'){
    setSbar('ok','✅ Saved · '+EXPENSES.length+' exp · '+TRAINING.length+' tr · '+new Date().toLocaleTimeString('th-TH'));
    notify('✅ บันทึกไป Sheets แล้ว');
  } else {
    setSbar('err','Error: '+(d.msg||JSON.stringify(d)));
    notify('❌ Push error','❌');
  }
  if(btn){ btn.disabled=false; btn.innerHTML='📤 บันทึก→Sheets'; }
}

function formPost(payload, cb){
  try{
    var frame=document.getElementById('_gs_frame');
    if(!frame){
      frame=document.createElement('iframe');
      frame.name='_gs_frame'; frame.id='_gs_frame';
      frame.style.display='none';
      document.body.appendChild(frame);
    }
    var form=document.createElement('form');
    form.method='POST'; form.action=GS; form.target='_gs_frame';
    form.style.display='none';
    var inp=document.createElement('input');
    inp.type='hidden'; inp.name='data'; inp.value=JSON.stringify(payload);
    form.appendChild(inp);
    document.body.appendChild(form);
    var timer=setTimeout(function(){ document.body.removeChild(form); if(cb)cb(true,'timeout-ok'); },3000);
    frame.onload=function(){ clearTimeout(timer); try{document.body.removeChild(form);}catch(ex){} if(cb)cb(true,'ok'); };
    form.submit();
  } catch(ex){ if(cb)cb(false,ex.message); }
}

    html+='<td><span class="pill pb" style="font-size:9px">'+t.zone.split(' ')[0]+'</span></td>';
    html+='<td>'+stPill(t.status)+'</td><td>'+(t.feel||'—')+'</td>';
    html+='<td style="font-size:11px;color:#6b7280;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(t.note||'—')+'</td>';
    html+='<td><div style="display:flex;gap:2px"><button class="btn btn-gh btn-ic btn-xs" onclick="event.stopPropagation();openEditTr(this.dataset.id)" data-id="'+t.id+'">✏️</button><button class="btn btn-gh btn-ic btn-xs" onclick="event.stopPropagation();delTr(this.dataset.id)" data-id="'+t.id+'">🗑️</button></div></td></tr>';
  });
  html+='</tbody></table></div></div>';
  C.innerHTML=html;
}

function exportCSV(){
  var list=curTab==='__all'?EXPENSES:raceExp(curTab);
  var h=['id','raceId','Race','name','cat','amount','date','currency','orig','status','method','note'];
  var rows=list.map(function(e){
    var rn=(RACES.find(function(r){ return r.id===e.raceId; })||{}).name||'';
    return [e.id,e.raceId,rn,e.name,e.cat,e.amount,e.date,e.currency,e.orig||'',e.status,e.method||'',e.note||''].map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  });
  var csv='\uFEFF'+[h.join(',')].concat(rows).join('\n');
  var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='expenses_'+new Date().toISOString().split('T')[0]+'.csv'; a.click();
  notify('📥 Export CSV แล้ว');
}

// ── Init ──
(async function(){
  go('finance');
  setSbar('load','กำลังดึงข้อมูลจาก Sheets...');
  try{
    var d=await fetchGET(GS+'?action=getAll');
    if(d.status==='ok'){
      // Expenses
      if(d.expenses&&d.expenses.length>0)
        EXPENSES=d.expenses.map(function(e){ return Object.assign({},e,{amount:Number(e.amount||0)}); });
      // Races
      if(d.races&&d.races.length>0){
        RACES=d.races.map(function(r){ return Object.assign({},r,{budget:Number(r.budget||0)}); });
        RACES.forEach(function(r){ BUDGETS[r.id]=Number(r.budget||0); });
      }
      // Training — ถ้า Sheets มีข้อมูลแล้ว ดึงมา
      // ถ้า Sheets ว่าง แต่ local มี → push ขึ้น Sheets อัตโนมัติ
      if(d.training&&d.training.length>0){
        TRAINING=d.training.map(function(t){ return Object.assign({},t,{dist:Number(t.dist||0),hr:Number(t.hr||0)}); });
        saveLocal();
        setSbar('ok','Synced จาก Sheets · '+EXPENSES.length+' exp · '+TRAINING.length+' training · '+new Date().toLocaleTimeString('th-TH'));
        go('finance');
      } else if(TRAINING.length>0){
        // Sheets ไม่มี Training เลย → auto push local training ขึ้น
        saveLocal();
        setSbar('load','Sheets ไม่มี Training — กำลัง push '+TRAINING.length+' รายการขึ้น...');
        go('finance');
        try{
          var tr=await gsPost({action:'saveAll', races:[], expenses:[], training:TRAINING});
          if(tr.status==='ok')
            setSbar('ok','Training pushed ครั้งแรก → Sheets · '+TRAINING.length+' รายการ · '+new Date().toLocaleTimeString('th-TH'));
          else
            setSbar('err','Push training error: '+(tr.msg||''));
        }catch(pe){ setSbar('err','Push training offline'); }
      } else {
        saveLocal();
        setSbar('ok','Sheets ว่าง — ใช้ข้อมูล local');
        go('finance');
      }
    } else {
      setSbar('ok','Sheets ว่าง — ใช้ local');
    }
  } catch(e){
    setSbar('err','offline — local: '+e.message);
  }
})();
</script>
